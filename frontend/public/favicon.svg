  <path d="M28 16l11-5.6-7.4 11-3.6-2.2.5-3.2H28Z" fill="url(#brand)" />

  <!-- Analytics bars -->
  <rect x="27" y="36" width="4.4" height="9" rx="2.2" fill="url(#bars)" />
  <rect x="34" y="31" width="4.4" height="14" rx="2.2" fill="url(#bars)" />
  <rect x="41" y="25" width="4.4" height="20" rx="2.2" fill="url(#bars)" />
