<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0F3D" />
      <stop offset="100%" stop-color="#08080F" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6433DE" />
      <stop offset="50%" stop-color="#8F73F2" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8F73F2" />
      <stop offset="100%" stop-color="#3B6BF0" />
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#8F73F2" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Paper-plane swoosh -->
