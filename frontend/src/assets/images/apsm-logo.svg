<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Primary brand gradient: violet → indigo → blue -->
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6433DE" />
      <stop offset="50%" style="stop-color:#8F73F2" />
      <stop offset="100%" style="stop-color:#22D3EE" />
    </linearGradient>
    <!-- Accent gradient for the chart bars -->
    <linearGradient id="bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#8F73F2;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3B6BF0" />
    </linearGradient>
  </defs>

  <!-- Swoosh / Paper plane trail -->
  <path d="M 120 280 C 120 180, 200 130, 260 120 L 250 150 C 190 160, 160 210, 160 280 Z" fill="url(#brand)" />

  <!-- Paper Plane -->
  <path d="M 230 110 L 330 60 L 260 160 Z" fill="url(#brand)" />
  <path d="M 230 110 L 255 125 L 260 160 Z" fill="#08080F" opacity="0.28" />

  <!-- Analytics bars -->
  <rect x="200" y="240" width="30" height="60" rx="6" fill="url(#bars)" />
  <rect x="250" y="200" width="30" height="100" rx="6" fill="url(#bars)" />
  <rect x="300" y="150" width="30" height="150" rx="6" fill="url(#bars)" />
</svg>
